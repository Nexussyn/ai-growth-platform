name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm migration on production'
        required: true
        default: 'YES'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run all migrations
    runs-on: ubuntu-latest

    env:
      PGHOST: db.kjtirbnxxymeumycrhqv.supabase.co
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Test connection
        run: psql -c "SELECT version();"

      - name: Apply all migrations
        run: |
          echo "Applying migrations..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--- $f"
            psql -v ON_ERROR_STOP=0 -f "$f" 2>&1 | grep -E '(ERROR|WARNING|CREATE|ALTER|INSERT|DROP|notice)' | head -10 || true
          done
          echo "Done!"

      - name: Verify tables
        run: |
          psql -c "
            SELECT schemaname, COUNT(*) as tables
            FROM pg_tables
            WHERE schemaname IN ('public','legacy')
            GROUP BY schemaname;
          "
