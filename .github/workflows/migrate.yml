name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm migration on production'
        required: true
        default: 'YES'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run all migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply all migrations via psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Applying migrations..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--- Applying: $f"
            psql "$SUPABASE_DB_URL" -f "$f" \
              --set ON_ERROR_STOP=off \
              -v VERBOSITY=terse 2>&1 | tail -5
            echo "Done: $f"
          done
          echo "All migrations processed!"

      - name: Verify migration count
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Tables created:"
          psql "$SUPABASE_DB_URL" -c "
            SELECT schemaname, COUNT(*) as tables
            FROM pg_tables
            WHERE schemaname IN ('public','legacy')
            GROUP BY schemaname
            ORDER BY schemaname;
          "
