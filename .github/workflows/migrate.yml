name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm migration on production'
        required: true
        default: 'YES'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run all migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply all migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF="kjtirbnxxymeumycrhqv"
          BASE="https://api.supabase.com/v1/projects/${PROJECT_REF}"
          MIGRATIONS_DIR="supabase/migrations"

          echo "=== Listing existing migrations on remote ==="
          EXISTING=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "${BASE}/database/migrations" \
            | jq -r '.[].version // empty' 2>/dev/null || echo "")
          echo "Remote count: $(echo "$EXISTING" | grep -c . || true)"

          SUCCESS=0
          FAIL=0
          SKIP=0

          for SQL_FILE in $(ls "$MIGRATIONS_DIR"/*.sql | sort); do
            FILENAME=$(basename "$SQL_FILE")
            VERSION=$(echo "$FILENAME" | sed 's/_.*//')
            NAME=$(echo "$FILENAME" | sed 's/\.sql$//' | sed 's/^[0-9]*_//')

            if echo "$EXISTING" | grep -qx "$VERSION"; then
              echo "--- $FILENAME  =>  SKIP"
              SKIP=$((SKIP+1))
              continue
            fi

            SQL=$(cat "$SQL_FILE")

            # Supabase Management API expects: { version, name, query }
            PAYLOAD=$(jq -n \
              --arg version "$VERSION" \
              --arg name "$NAME" \
              --arg query "$SQL" \
              '{version: $version, name: $name, query: $query}')

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "${BASE}/database/migrations" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "--- $FILENAME"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  OK"
              SUCCESS=$((SUCCESS+1))
            else
              ERROR=$(echo "$BODY" | jq -r '.message // .error // .detail // "Unknown error"' 2>/dev/null || echo "$BODY")
              echo "  FAIL ($HTTP_CODE): $ERROR"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "SUCCESS: $SUCCESS / SKIP: $SKIP / FAIL: $FAIL"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
