name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm migration on production'
        required: true
        default: 'YES'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_PROJECT_ID: kjtirbnxxymeumycrhqv

jobs:
  migrate:
    name: Run all migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Applying migrations via Supabase API..."
          SUCCESS=0
          FAIL=0

          for f in $(ls supabase/migrations/*.sql | sort); do
            NAME=$(basename "$f" .sql)
            SQL=$(cat "$f")
            echo "--- Applying: $NAME"

            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "$(jq -n --arg q "$SQL" '{query: $q}')")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "  OK ($HTTP_CODE)"
              SUCCESS=$((SUCCESS+1))
            else
              MSG=$(cat /tmp/resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','?'))" 2>/dev/null || echo 'unknown')
              echo "  SKIP ($HTTP_CODE): $MSG"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "============================"
          echo "SUCCESS: $SUCCESS"
          echo "SKIPPED/WARN: $FAIL"
          echo "============================"
